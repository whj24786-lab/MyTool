<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Which AI Tool Is Right for You?</title>
<style>
  :root{
    --color-bg: #f6f7fb;
    --color-surface: #ffffff;
    --color-primary: #4f46e5;
    --color-primary-dark: #3f3adb;
    --color-primary-soft: #eef0fd;
    --color-text: #1f2330;
    --color-text-muted: #5b6072;
    --color-border: #e3e5ee;
    --color-success: #1a8a5a;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 2px 10px rgba(20,20,50,0.06), 0 1px 2px rgba(20,20,50,0.04);
    --max-width: 760px;
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Arabic", "Tahoma", sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-stack);
    line-height: 1.55;
  }

  body{
    min-height: 100vh;
    display:flex;
    flex-direction:column;
  }

  [dir="rtl"]{ text-align: right; }

  a{ color: var(--color-primary); }

  button{ font-family: inherit; }

  .visually-hidden{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* Header */
  header.site-header{
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-inner{
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 12px;
  }
  .brand{
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--color-text);
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand-mark{
    width: 28px; height:28px; border-radius:8px;
    background: linear-gradient(135deg, var(--color-primary), #7c73f0);
    flex-shrink:0;
  }
  nav.main-nav{
    display:flex;
    align-items:center;
    gap: 6px;
  }
  nav.main-nav button.nav-link{
    background:none; border:none; cursor:pointer;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    color: var(--color-text-muted);
    font-size: 0.92rem;
  }
  nav.main-nav button.nav-link:hover,
  nav.main-nav button.nav-link.active{
    background: var(--color-primary-soft);
    color: var(--color-primary);
  }
  button.lang-switch{
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    color: var(--color-text);
    padding: 7px 12px;
    border-radius: 999px;
    cursor:pointer;
    font-size: 0.85rem;
    font-weight:600;
  }
  button.lang-switch:hover{ border-color: var(--color-primary); color: var(--color-primary); }

  /* Main layout */
  main{
    flex:1;
    width:100%;
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  .card{
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px;
  }

  @media (max-width: 480px){
    .card{ padding: 20px; }
    main{ padding: 20px 14px 48px; }
  }

  /* Landing */
  .landing-hero h1{
    font-size: 1.7rem;
    margin: 0 0 10px;
  }
  .landing-hero p.tagline{
    color: var(--color-text-muted);
    font-size: 1.02rem;
    margin: 0 0 22px;
  }
  .info-row{
    display:flex;
    gap: 14px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .info-pill{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--color-primary-soft);
    color: var(--color-primary-dark);
    padding: 10px 14px;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 600;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border: none;
    border-radius: var(--radius-sm);
    padding: 13px 22px;
    font-size: 1rem;
    font-weight: 600;
    cursor:pointer;
    transition: background-color .15s ease, transform .05s ease;
  }
  .btn-primary{
    background: var(--color-primary);
    color: #fff;
  }
  .btn-primary:hover{ background: var(--color-primary-dark); }
  .btn-primary:active{ transform: scale(0.99); }
  .btn-primary:disabled{
    background: #c9cbe0;
    cursor:not-allowed;
  }
  .btn-secondary{
    background: var(--color-surface);
    color: var(--color-text);
    border: 1px solid var(--color-border);
  }
  .btn-secondary:hover{ border-color: var(--color-primary); color: var(--color-primary); }
  .btn-danger-outline{
    background: var(--color-surface);
    color: #b8402a;
    border: 1px solid #f1c9bd;
  }
  .btn-danger-outline:hover{ background: #fdf1ee; }

  .privacy-note{
    margin-top: 18px;
    font-size: 0.86rem;
    color: var(--color-text-muted);
    display:flex;
    align-items:flex-start;
    gap:8px;
  }

  .nav-buttons{
    display:flex;
    justify-content:space-between;
    gap: 12px;
    margin-top: 24px;
  }
  [dir="rtl"] .nav-buttons{ flex-direction: row-reverse; }

  /* Quiz */
  .quiz-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 10px;
    font-size: 0.86rem;
    color: var(--color-text-muted);
    font-weight:600;
  }
  .progress-track{
    height: 8px;
    background: var(--color-border);
    border-radius: 999px;
    overflow:hidden;
    margin-bottom: 22px;
  }
  .progress-fill{
    height: 100%;
    background: var(--color-primary);
    border-radius: 999px;
    transition: width .25s ease;
  }
  .question-text{
    font-size: 1.2rem;
    font-weight: 700;
    margin: 0 0 18px;
  }
  .options-list{
    display:flex;
    flex-direction: column;
    gap: 10px;
    list-style:none;
    margin:0; padding:0;
  }
  .option-item label{
    display:flex;
    align-items:flex-start;
    gap: 12px;
    border: 1.5px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    cursor:pointer;
    transition: border-color .12s ease, background-color .12s ease;
  }
  .option-item label:hover{ border-color: var(--color-primary); background: var(--color-primary-soft); }
  .option-item input[type="radio"]{
    margin-top: 3px;
    accent-color: var(--color-primary);
    width: 17px; height: 17px;
    flex-shrink:0;
  }
  .option-item input[type="radio"]:checked + span{ font-weight:600; }
  .option-item:has(input:checked) label{
    border-color: var(--color-primary);
    background: var(--color-primary-soft);
  }
  .validation-msg{
    color:#b8402a;
    font-size: 0.86rem;
    margin-top: 14px;
    min-height: 1.2em;
  }

  /* Results */
  .result-badge{
    display:inline-block;
    background: var(--color-primary-soft);
    color: var(--color-primary-dark);
    font-weight:700;
    font-size: 0.8rem;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding: 6px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .result-category{
    font-size: 1.5rem;
    font-weight: 800;
    margin: 0 0 14px;
    color: var(--color-primary-dark);
  }
  .result-section{
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px solid var(--color-border);
  }
  .result-section h3{
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing:.03em;
    color: var(--color-text-muted);
    margin: 0 0 10px;
  }
  .result-section p{ margin: 0; }
  .skills-list{ margin: 6px 0 0; padding-inline-start: 20px; }
  .skills-list li{ margin-bottom: 6px; }
  .criteria-list{ margin: 6px 0 0; padding-inline-start: 20px; }
  .criteria-list li{ margin-bottom: 6px; }

  .score-bars{ margin-top: 10px; display:flex; flex-direction:column; gap:10px; }
  .score-bar-row{ display:flex; align-items:center; gap:10px; font-size:0.85rem; }
  .score-bar-label{ width: 140px; flex-shrink:0; color: var(--color-text-muted); }
  .score-bar-track{ flex:1; background: var(--color-border); border-radius:999px; height:8px; overflow:hidden; }
  .score-bar-fill{ height:100%; background: var(--color-primary); border-radius:999px; }
  .score-bar-value{ width: 26px; text-align:end; color: var(--color-text-muted); flex-shrink:0; }

  .disclaimer-box{
    margin-top: 22px;
    background: #fff8ec;
    border: 1px solid #f2e2bd;
    color: #7a5a10;
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    font-size: 0.88rem;
  }

  .result-actions{
    display:flex;
    gap: 12px;
    margin-top: 26px;
    flex-wrap: wrap;
  }

  .storage-note{
    margin-top: 14px;
    font-size: 0.82rem;
    color: var(--color-text-muted);
  }

  /* About page */
  .about-section{ margin-bottom: 22px; }
  .about-section:last-child{ margin-bottom: 0; }
  .about-section h2{ font-size: 1.05rem; margin: 0 0 8px; }
  .about-section p{ margin: 0; color: var(--color-text); }

  footer.site-footer{
    text-align:center;
    color: var(--color-text-muted);
    font-size: 0.82rem;
    padding: 18px 20px 30px;
  }

  @media (max-width: 480px){
    .score-bar-label{ width: 100px; }
  }
</style>
</head>

  try{
    var t = "__aiToolQuiz_test__";

    window.localStorage.removeItem(t);
    return true;
  }catch(e){
    return false;
  }
}
var HAS_LS = storageIsAvailable();

function persistState(state){
  try{
    var json = JSON.stringify(state);
    if(HAS_LS){
      window.localStorage.setItem(STORAGE_KEY, json);
    }else{
      memoryStore[STORAGE_KEY] = json;
    }
  }catch(e){
    memoryStore[STORAGE_KEY] = JSON.stringify(state);
  }
}

function readState(){
  try{
    var json = HAS_LS ? window.localStorage.getItem(STORAGE_KEY) : memoryStore[STORAGE_KEY];
    return json ? JSON.parse(json) : null;
  }catch(e){
    return null;
  }
}

function clearPersistedState(){
  try{
    if(HAS_LS){ window.localStorage.removeItem(STORAGE_KEY); }

/* ---------------------------------------------------------
   APPLICATION STATE
--------------------------------------------------------- */
var DEFAULT_STATE = {
  lang: "en",
  page: "landing",      // landing | quiz | results | about
  currentQuestion: 0,
  answers: {},           // { q1: optionIndex, ... }
  finished: false
};

var state = loadInitialState();
var restoredFromStorage = false;

function loadInitialState(){
  var saved = readState();
  if(saved && typeof saved === "object"){
    restoredFromStorage = !!(saved.answers && Object.keys(saved.answers).length > 0);
    var merged = {};
    for(var k in DEFAULT_STATE){ merged[k] = DEFAULT_STATE[k]; }
    for(var k2 in saved){ merged[k2] = saved[k2]; }
    return merged;
  }
  var fresh = {};
  for(var k3 in DEFAULT_STATE){ fresh[k3] = DEFAULT_STATE[k3]; }
  fresh.answers = {};
  return fresh;
}

function save(){
  persistState(state);
}

/* ---------------------------------------------------------
   SCORING
--------------------------------------------------------- */
function computeResults(){
  var scores = { research:0, writing:0, coding:0, design:0, data:0 };
  var levels = [];

  QUESTIONS.forEach(function(q){
    var idx = state.answers[q.key];
    if(idx === undefined || idx === null) return;
    var opt = q.options[idx];
    if(!opt) return;
    if(opt.scores){
      Object.keys(opt.scores).forEach(function(cat){
        scores[cat] = (scores[cat] || 0) + opt.scores[cat];
      });
    }
    if(typeof opt.level === "number"){
      levels.push(opt.level);
    }
  });

  var topCategory = CATEGORIES[0];
  var topScore = -1;
  CATEGORIES.forEach(function(cat){
    if(scores[cat] > topScore){
      topScore = scores[cat];
      topCategory = cat;
    }
  });

  var avgLevel = levels.length ? (levels.reduce(function(a,b){return a+b;},0) / levels.length) : 2;
  var roundedLevel = Math.round(avgLevel);
  if(roundedLevel < 1) roundedLevel = 1;
  if(roundedLevel > 3) roundedLevel = 3;
  var levelKey = roundedLevel === 1 ? "beginner" : (roundedLevel === 2 ? "intermediate" : "advanced");

  var maxScore = 0;
  CATEGORIES.forEach(function(cat){ if(scores[cat] > maxScore) maxScore = scores[cat]; });

  return { scores: scores, topCategory: topCategory, levelKey: levelKey, maxScore: maxScore || 1 };
}

   RENDERING HELPERS
--------------------------------------------------------- */

function esc(str){
  var div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function setPage(page){
  state.page = page;
  save();
  render();
  window.scrollTo(0,0);
}

function setLang(lang){
  state.lang = lang;
  save();
  render();
}

/* ---------------------------------------------------------
   PAGE RENDERERS
--------------------------------------------------------- */
function renderLanding(){
  var t = tr();
  var html = '';
  html += '<div class="card landing-hero">';
  html += '<h1>' + esc(t.appName) + '</h1>';
  html += '<p class="tagline">' + esc(t.tagline) + '</p>';
  html += '<div class="info-row">';
  html += '<span class="info-pill">📝 ' + esc(t.questionsCount) + '</span>';
  html += '</div>';
  if(restoredFromStorage && !state.finished){
    html += '<div class="privacy-note">🔄 ' + esc(t.resumeNote) + '</div>';
  }
  html += '<button type="button" class="btn btn-primary" id="startTestBtn">' + esc(t.startTest) + '</button>';
  html += '<div class="privacy-note">🔒 ' + esc(t.privacyNoteLanding) + '</div>';
  html += '</div>';
  return html;
}

function renderQuiz(){
  var t = tr();
  var q = QUESTIONS[state.currentQuestion];
  var total = QUESTIONS.length;
  var progressPct = Math.round(((state.currentQuestion + 1) / total) * 100);
  var selected = state.answers[q.key];

  var html = '';
  html += '<div class="card">';
  html += '<div class="quiz-meta"><span>' + esc(t.questionLabel) + ' ' + (state.currentQuestion+1) + ' ' + esc(t.ofLabel) + ' ' + total + '</span><span>' + progressPct + '%</span></div>';
  html += '<div class="progress-track" role="progressbar" aria-valuenow="' + progressPct + '" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:' + progressPct + '%"></div></div>';

  html += '<fieldset style="border:none;padding:0;margin:0;">';
  html += '<legend class="question-text">' + esc(t.questions[q.key + '_text']) + '</legend>';
  html += '<ul class="options-list">';
  q.options.forEach(function(opt, i){
    var optText = t.questions[q.key + '_' + opt.key];
    var checked = (selected === i) ? ' checked' : '';
    html += '<li class="option-item">';
    html += '<label>';
    html += '<input type="radio" name="' + q.key + '" value="' + i + '"' + checked + ' data-qkey="' + q.key + '" data-optindex="' + i + '">';
    html += '<span>' + esc(optText) + '</span>';
    html += '</label>';
    html += '</li>';
  });
  html += '</ul>';
  html += '</fieldset>';

  html += '<div class="validation-msg" id="validationMsg" aria-live="polite"></div>';

  html += '<div class="nav-buttons">';
  html += '<button type="button" class="btn btn-secondary" id="prevBtn"' + (state.currentQuestion === 0 ? ' disabled' : '') + '>' + esc(t.prev) + '</button>';
  var isLast = state.currentQuestion === total - 1;
  html += '<button type="button" class="btn btn-primary" id="nextBtn">' + esc(isLast ? t.seeResults : t.next) + '</button>';
  html += '</div>';
  html += '</div>';
  return html;
}

function renderResults(){
  var t = tr();
  var results = computeResults();
  var cat = t.categories[results.topCategory];
  var levelText = t.levels[results.levelKey];

  var html = '';
  html += '<div class="card">';
  html += '<span class="result-badge">✓ ' + esc(t.resultsBadge) + '</span>';
  html += '<div>' + esc(t.recommendedCategory) + '</div>';
  html += '<h2 class="result-category">' + esc(cat.name) + '</h2>';

  html += '<div class="result-section"><h3>' + esc(t.whySelected) + '</h3><p>' + esc(cat.why) + '</p></div>';

  html += '<div class="result-section"><h3>' + esc(t.yourLevel) + '</h3><p>' + esc(levelText) + '</p></div>';

  html += '<div class="result-section"><h3>' + esc(t.suggestedSkills) + '</h3><ul class="skills-list">';
  cat.skills.forEach(function(s){ html += '<li>' + esc(s) + '</li>'; });
  html += '</ul></div>';

  html += '<div class="result-section"><h3>' + esc(t.comparisonCriteria) + '</h3><ul class="criteria-list">';
  t.comparisonCriteriaList.forEach(function(c){ html += '<li>' + esc(c) + '</li>'; });
  html += '</ul></div>';

  html += '<div class="result-section"><h3>' + esc(t.scoreBreakdown) + '</h3><div class="score-bars">';
  CATEGORIES.forEach(function(c){
    var val = results.scores[c] || 0;
    var pct = Math.round((val / results.maxScore) * 100);
    html += '<div class="score-bar-row">';
    html += '<span class="score-bar-label">' + esc(t.categories[c].name) + '</span>';
    html += '<span class="score-bar-track"><span class="score-bar-fill" style="width:' + pct + '%"></span></span>';
    html += '<span class="score-bar-value">' + val + '</span>';
    html += '</div>';
  });
  html += '</div></div>';

  html += '<div class="disclaimer-box">⚠️ ' + esc(t.disclaimer) + '</div>';

  html += '<div class="result-actions">';
  html += '<button type="button" class="btn btn-danger-outline" id="startOverBtn">' + esc(t.startOver) + '</button>';
  html += '</div>';
  html += '<div class="storage-note">🔒 ' + esc(t.storageNote) + '</div>';
  html += '</div>';
  return html;
}

function renderAbout(){
  var t = tr();
  var html = '';
  html += '<div class="card">';
  html += '<h1>' + esc(t.aboutTitle) + '</h1>';
  html += '<div class="about-section"><h2>' + esc(t.aboutPurposeTitle) + '</h2><p>' + esc(t.aboutPurposeText) + '</p></div>';
  html += '<div class="about-section"><h2>' + esc(t.aboutHowTitle) + '</h2><p>' + esc(t.aboutHowText) + '</p></div>';
  html += '<div class="about-section"><h2>' + esc(t.aboutPrivacyTitle) + '</h2><p>' + esc(t.aboutPrivacyText) + '</p></div>';
  html += '</div>';
  return html;
}

/* ---------------------------------------------------------
   MASTER RENDER
--------------------------------------------------------- */
function render(){
  var t = tr();
  document.documentElement.lang = state.lang;
  document.documentElement.dir = t.dir;
  document.title = t.appName;

  document.getElementById("brandText").textContent = t.brandShort;
  document.getElementById("navHomeBtn").textContent = t.navHome;
  document.getElementById("navAboutBtn").textContent = t.navAbout;
  document.getElementById("langSwitchBtn").textContent = t.langSwitchLabel;
  document.getElementById("navHomeBtn").classList.toggle("active", state.page === "landing" || state.page === "quiz" || state.page === "results");
  document.getElementById("navAboutBtn").classList.toggle("active", state.page === "about");
  document.getElementById("siteFooter").textContent = t.footerPrivacy;

  var app = document.getElementById("app");
  var html = "";
  if(state.page === "landing"){ html = renderLanding(); }
  else if(state.page === "quiz"){ html = renderQuiz(); }
  else if(state.page === "results"){ html = renderResults(); }
  else if(state.page === "about"){ html = renderAbout(); }
  else { html = renderLanding(); }

  app.innerHTML = html;
  attachPageListeners();
}

/* ---------------------------------------------------------
   EVENT WIRING
--------------------------------------------------------- */
function attachGlobalListeners(){
  document.getElementById("navHomeBtn").addEventListener("click", function(){
    if(state.finished){ setPage("results"); }
    else if(Object.keys(state.answers).length > 0){ setPage("quiz"); }
    else { setPage("landing"); }
  });
  document.getElementById("navAboutBtn").addEventListener("click", function(){ setPage("about"); });
  document.getElementById("langSwitchBtn").addEventListener("click", function(){
    setLang(state.lang === "en" ? "ar" : "en");
  });
}

function attachPageListeners(){
  var t = tr();

  var startBtn = document.getElementById("startTestBtn");
  if(startBtn){
    startBtn.addEventListener("click", function(){
      state.page = "quiz";
      state.currentQuestion = 0;
      state.finished = false;
      save();
      render();
    });
  }

  var radios = document.querySelectorAll('input[type="radio"][data-qkey]');
  radios.forEach(function(r){
    r.addEventListener("change", function(){
      var qkey = r.getAttribute("data-qkey");
      var idx = parseInt(r.getAttribute("data-optindex"), 10);
      state.answers[qkey] = idx;
      save();
      var msg = document.getElementById("validationMsg");
      if(msg) msg.textContent = "";
    });
  });

  var prevBtn = document.getElementById("prevBtn");
  if(prevBtn){
    prevBtn.addEventListener("click", function(){
      if(state.currentQuestion > 0){
        state.currentQuestion -= 1;
        save();
        render();
      }
    });
  }

  var nextBtn = document.getElementById("nextBtn");
  if(nextBtn){
    nextBtn.addEventListener("click", function(){
      var q = QUESTIONS[state.currentQuestion];
      if(state.answers[q.key] === undefined || state.answers[q.key] === null){
        var msg = document.getElementById("validationMsg");
        if(msg) msg.textContent = t.selectPrompt;
        return;
      }
      if(state.currentQuestion < QUESTIONS.length - 1){
        state.currentQuestion += 1;
        save();
        render();
      }else{
        state.finished = true;
        state.page = "results";
        save();
        render();
      }
    });
  }

  var startOverBtn = document.getElementById("startOverBtn");
  if(startOverBtn){
    startOverBtn.addEventListener("click", function(){
      if(window.confirm(t.startOverConfirm)){
        clearPersistedState();
        var langKeep = state.lang;
        state = {
          lang: langKeep,
          page: "landing",
          currentQuestion: 0,
          answers: {},
          finished: false
        };
        restoredFromStorage = false;
        save();
        render();
      }
    });
  }
}

/* ---------------------------------------------------------
   INIT
--------------------------------------------------------- */
attachGlobalListeners();
render();

})();
</script>
</body>
</html>
